<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" font-family="Inter, system-ui, sans-serif" font-size="13">
  <!-- styles -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0277bd"/>
    </marker>
  </defs>

  <!-- Internet / user -->
  <g>
    <rect x="20" y="20" width="180" height="50" rx="6" fill="#fff" stroke="#333"/>
    <text x="110" y="50" text-anchor="middle" font-weight="600">Browser (user)</text>
  </g>
  <g>
    <rect x="220" y="20" width="240" height="50" rx="6" fill="#fff" stroke="#333"/>
    <text x="340" y="42" text-anchor="middle" font-weight="600">CloudFront</text>
    <text x="340" y="60" text-anchor="middle" font-size="11" fill="#555">d17bqzy8fgqhxi.cloudfront.net</text>
  </g>
  <g>
    <rect x="480" y="20" width="220" height="50" rx="6" fill="#fff" stroke="#333"/>
    <text x="590" y="42" text-anchor="middle" font-weight="600">S3 (SvelteKit static)</text>
    <text x="590" y="60" text-anchor="middle" font-size="11" fill="#555">activityual-frontend-…</text>
  </g>

  <!-- VPC -->
  <rect x="40" y="100" width="1100" height="700" rx="10" fill="#e1f5fe" stroke="#0277bd"/>
  <text x="60" y="122" font-weight="600" fill="#01579b">VPC 10.0.0.0/16  (us-east-1, 2 AZs)</text>

  <!-- Public subnets -->
  <rect x="60" y="140" width="1060" height="110" rx="8" fill="#fff9c4" stroke="#f9a825"/>
  <text x="80" y="160" font-weight="600" fill="#795700">Public subnets 10.0.0.0/24, 10.0.1.0/24  (ALB · NAT · IGW)</text>
  <g>
    <rect x="100" y="180" width="200" height="50" rx="6" fill="#fff" stroke="#333"/>
    <text x="200" y="202" text-anchor="middle" font-weight="600">ALB (HTTPS)</text>
    <text x="200" y="220" text-anchor="middle" font-size="11" fill="#555">idle_timeout=120s</text>
  </g>
  <g>
    <rect x="340" y="180" width="160" height="50" rx="6" fill="#fff" stroke="#333"/>
    <text x="420" y="210" text-anchor="middle" font-weight="600">NAT Gateway</text>
  </g>
  <g>
    <rect x="540" y="180" width="200" height="50" rx="6" fill="#fff" stroke="#333"/>
    <text x="640" y="210" text-anchor="middle" font-weight="600">Internet Gateway</text>
  </g>

  <!-- private-app -->
  <rect x="60" y="265" width="1060" height="200" rx="8" fill="#dcedc8" stroke="#558b2f"/>
  <text x="80" y="285" font-weight="600" fill="#33691e">Private-app subnets 10.0.16.0/22, 10.0.20.0/22  (EKS general nodegroup, t3.large)</text>
  <g font-size="12">
    <rect x="80"  y="300" width="160" height="40" rx="5" fill="#fff" stroke="#333"/><text x="160"  y="325" text-anchor="middle" font-weight="600">gateway-service</text>
    <rect x="260" y="300" width="160" height="40" rx="5" fill="#fff" stroke="#333"/><text x="340"  y="325" text-anchor="middle" font-weight="600">auth-service</text>
    <rect x="440" y="300" width="160" height="40" rx="5" fill="#fff" stroke="#333"/><text x="520"  y="325" text-anchor="middle" font-weight="600">activity-service</text>
    <rect x="620" y="300" width="160" height="40" rx="5" fill="#fff" stroke="#333"/><text x="700"  y="325" text-anchor="middle" font-weight="600">tracking-service</text>
    <rect x="800" y="300" width="160" height="40" rx="5" fill="#fff" stroke="#333"/><text x="880"  y="325" text-anchor="middle" font-weight="600">analytics-service</text>

    <rect x="80"  y="355" width="220" height="40" rx="5" fill="#fff" stroke="#333"/><text x="190" y="380" text-anchor="middle" font-weight="600">recommendation-service</text>
    <rect x="320" y="355" width="200" height="40" rx="5" fill="#fff" stroke="#333"/><text x="420" y="380" text-anchor="middle" font-weight="600">notification-service</text>
    <rect x="540" y="355" width="200" height="40" rx="5" fill="#ffe0b2" stroke="#bf360c"/><text x="640" y="380" text-anchor="middle" font-weight="600">RabbitMQ (StatefulSet)</text>
    <rect x="760" y="355" width="200" height="40" rx="5" fill="#ffe0b2" stroke="#bf360c"/><text x="860" y="380" text-anchor="middle" font-weight="600">Chroma (StatefulSet PVC)</text>

    <rect x="80"  y="410" width="880" height="40" rx="5" fill="#fff" stroke="#bbb"/>
    <text x="520" y="435" text-anchor="middle" font-style="italic" fill="#555">HPA on every Deployment (min 1, max 2, CPU 70%) · ConfigMaps + Secrets per service · Fluent Bit DaemonSet → CloudWatch</text>
  </g>

  <!-- private-ai -->
  <rect x="60" y="480" width="1060" height="110" rx="8" fill="#f8bbd0" stroke="#ad1457"/>
  <text x="80" y="500" font-weight="600" fill="#880e4f">Private-ai subnets 10.0.32.0/24, 10.0.33.0/24  (EKS AI nodegroup, SPOT t3.xlarge, taint workload=ai:NoSchedule)</text>
  <g>
    <rect x="120" y="520" width="200" height="50" rx="6" fill="#fff" stroke="#333"/>
    <text x="220" y="542" text-anchor="middle" font-weight="600">coach-service</text>
    <text x="220" y="560" text-anchor="middle" font-size="11" fill="#555">RAG → Chroma → Ollama</text>
  </g>
  <g>
    <rect x="360" y="520" width="260" height="50" rx="6" fill="#ffe0b2" stroke="#bf360c"/>
    <text x="490" y="542" text-anchor="middle" font-weight="600">Ollama (llama3.2:3b)</text>
    <text x="490" y="560" text-anchor="middle" font-size="11" fill="#555">keep_alive=30m · num_predict=256</text>
  </g>

  <!-- private-db -->
  <rect x="60" y="605" width="1060" height="110" rx="8" fill="#d1c4e9" stroke="#4527a0"/>
  <text x="80" y="625" font-weight="600" fill="#311b92">Private-db subnets 10.0.40.0/27, 10.0.40.32/27  (RDS only · SG locked to nodes SG on 5432)</text>
  <g>
    <rect x="120" y="645" width="940" height="55" rx="6" fill="#fff" stroke="#333"/>
    <text x="590" y="668" text-anchor="middle" font-weight="600">RDS Postgres 16 (activityual-rds, db.t4g.medium, encrypted, multi-AZ-ready)</text>
    <text x="590" y="688" text-anchor="middle" font-size="11" fill="#555">authdb · activitydb · trackingdb · analyticsdb · recodb · notifdb</text>
  </g>

  <!-- Observability sidebar -->
  <rect x="60" y="730" width="1060" height="60" rx="8" fill="#fff" stroke="#999" stroke-dasharray="4 3"/>
  <text x="590" y="755" text-anchor="middle" font-weight="600" fill="#444">CloudWatch Container Insights (Fluent Bit logs · pod metrics) · 3 alarms → SNS · Secrets Manager · ECR scan-on-push · GitHub Actions OIDC role</text>
  <text x="590" y="775" text-anchor="middle" font-size="11" fill="#777">Alarms: activityual-alb-5xx · activityual-eks-high-pod-cpu · activityual-rds-high-connections</text>

  <!-- ===== Arrows ===== -->
  <!-- browser → CF -->
  <line x1="200" y1="45" x2="220" y2="45" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- CF → S3 -->
  <line x1="460" y1="45" x2="480" y2="45" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- CF → ALB -->
  <path d="M 340 70 C 340 130, 200 130, 200 180" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- ALB → gateway -->
  <line x1="200" y1="230" x2="160" y2="300" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- gateway → fanout services (visual hint) -->
  <line x1="240" y1="320" x2="260" y2="320" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="320" x2="440" y2="320" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.4"/>
  <line x1="240" y1="320" x2="620" y2="320" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.4"/>
  <line x1="240" y1="320" x2="800" y2="320" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.4"/>
  <line x1="160" y1="340" x2="190" y2="355" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="160" y1="340" x2="220" y2="520" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- tracking → rabbitmq (async, dashed) -->
  <path d="M 700 340 C 700 355, 640 355, 640 355" fill="none" stroke="#0277bd" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>
  <!-- rabbitmq → consumers (4 dashed) -->
  <line x1="640" y1="395" x2="190" y2="395" stroke="#0277bd" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)" opacity="0.6"/>
  <line x1="640" y1="395" x2="420" y2="395" stroke="#0277bd" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)" opacity="0.6"/>
  <line x1="640" y1="395" x2="880" y2="340" stroke="#0277bd" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)" opacity="0.6"/>
  <line x1="640" y1="395" x2="220" y2="520" stroke="#0277bd" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)" opacity="0.6"/>
  <!-- coach → ollama -->
  <line x1="320" y1="545" x2="360" y2="545" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- coach → chroma -->
  <path d="M 220 520 C 220 470, 860 460, 860 395" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- services → RDS -->
  <line x1="340" y1="340" x2="590" y2="645" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.5"/>
  <line x1="520" y1="340" x2="590" y2="645" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.5"/>
  <line x1="700" y1="340" x2="590" y2="645" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.5"/>
  <line x1="880" y1="340" x2="590" y2="645" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.5"/>
  <line x1="190" y1="395" x2="590" y2="645" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.5"/>
  <line x1="420" y1="395" x2="590" y2="645" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.5"/>

  <!-- legend -->
  <g font-size="11" fill="#444">
    <line x1="780" y1="178" x2="820" y2="178" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="828" y="182">sync HTTP</text>
    <line x1="900" y1="178" x2="940" y2="178" stroke="#0277bd" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>
    <text x="948" y="182">async (RabbitMQ)</text>
  </g>
</svg>

