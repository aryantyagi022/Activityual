apiVersion: apps/v1
kind: StatefulSet
metadata: { name: rabbitmq }
spec:
  serviceName: rabbitmq
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image | quote }}
          ports:
            - { containerPort: 5672, name: amqp }
            - { containerPort: 15672, name: mgmt }
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ ReadWriteOnce ]
        resources: { requests: { storage: {{ .Values.rabbitmq.storage }} } }
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq }
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: mgmt, port: 15672, targetPort: 15672 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: chroma }
spec:
  serviceName: chroma
  replicas: 1
  selector: { matchLabels: { app: chroma } }
  template:
    metadata: { labels: { app: chroma } }
    spec:
      containers:
        - name: chroma
          image: {{ .Values.chroma.image | quote }}
          ports: [ { containerPort: 8000 } ]
          volumeMounts: [ { name: data, mountPath: /chroma/chroma } ]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ ReadWriteOnce ]
        resources: { requests: { storage: {{ .Values.chroma.storage }} } }
---
apiVersion: v1
kind: Service
metadata: { name: chroma }
spec:
  selector: { app: chroma }
  ports: [ { port: 8000, targetPort: 8000 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ollama }
spec:
  replicas: 1
  selector: { matchLabels: { app: ollama } }
  template:
    metadata: { labels: { app: ollama } }
    spec:
      nodeSelector: {{- toYaml .Values.ollama.nodeSelector | nindent 8 }}
      tolerations: {{- toYaml .Values.ollama.tolerations | nindent 8 }}
      containers:
        - name: ollama
          image: {{ .Values.ollama.image | quote }}
          ports: [ { containerPort: 11434 } ]
          volumeMounts: [ { name: models, mountPath: /root/.ollama } ]
          lifecycle:
            postStart:
              exec:
                command: [ "/bin/sh","-c","sleep 5 && ollama pull {{ .Values.ollama.model }} || true" ]
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: ollama-models }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: ollama-models }
spec:
  accessModes: [ ReadWriteOnce ]
  resources: { requests: { storage: {{ .Values.ollama.storage }} } }
---
apiVersion: v1
kind: Service
metadata: { name: ollama }
spec:
  selector: { app: ollama }
  ports: [ { port: 11434, targetPort: 11434 } ]

