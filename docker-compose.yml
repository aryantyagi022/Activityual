name: activityual

x-spring-env: &spring-env
  SPRING_PROFILES_ACTIVE: docker
  SPRING_RABBITMQ_HOST: ${RABBIT_HOST}
  SPRING_RABBITMQ_PORT: ${RABBIT_PORT}
  SPRING_RABBITMQ_USERNAME: ${RABBIT_USER}
  SPRING_RABBITMQ_PASSWORD: ${RABBIT_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  JWT_ACCESS_TTL_MIN: ${JWT_ACCESS_TTL_MIN}
  JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS}
  LOG_LEVEL: ${LOG_LEVEL}

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: activityual
    ports: ["5433:5432"]
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
      - ./infra/local/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      retries: 10

  chroma:
    image: chromadb/chroma:0.5.5
    ports: ["8000:8000"]
    volumes:
      - ./.data/chroma:/chroma/chroma
    environment:
      ALLOW_RESET: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"

  ollama:
    image: ollama/ollama:0.3.14
    expose: ["11434"]
    volumes:
      - ./.data/ollama:/root/.ollama
    # Host port 11434 intentionally NOT mapped — keep the host's local Ollama free.
    # If you want to expose it, add:  ports: ["11500:11434"]

  gateway-service:
    build: { context: ./backend, dockerfile: gateway-service/Dockerfile }
    environment:
      <<: *spring-env
      AUTH_URL: http://auth-service:8081
      ACTIVITY_URL: http://activity-service:8082
      TRACKING_URL: http://tracking-service:8083
      ANALYTICS_URL: http://analytics-service:8084
      COACH_URL: http://coach-service:8085
      RECO_URL: http://recommendation-service:8086
      NOTIF_URL: http://notification-service:8087
    ports: ["8080:8080"]
    depends_on: [auth-service, activity-service, tracking-service, analytics-service, coach-service, recommendation-service, notification-service]

  auth-service:
    build: { context: ./backend, dockerfile: auth-service/Dockerfile }
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/authdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on: { postgres: { condition: service_healthy } }

  activity-service:
    build: { context: ./backend, dockerfile: activity-service/Dockerfile }
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/activitydb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on: { postgres: { condition: service_healthy } }

  tracking-service:
    build: { context: ./backend, dockerfile: tracking-service/Dockerfile }
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/trackingdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  analytics-service:
    build: { context: ./backend, dockerfile: analytics-service/Dockerfile }
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/analyticsdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  coach-service:
    build: { context: ./backend, dockerfile: coach-service/Dockerfile }
    environment:
      <<: *spring-env
      CHROMA_URL: ${CHROMA_URL}
      OLLAMA_URL: ${OLLAMA_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    depends_on:
      rabbitmq: { condition: service_healthy }

  recommendation-service:
    build: { context: ./backend, dockerfile: recommendation-service/Dockerfile }
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/recodb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  notification-service:
    build: { context: ./backend, dockerfile: notification-service/Dockerfile }
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notifdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  frontend:
    build: { context: ./frontend }
    environment:
      PUBLIC_API_BASE: ${PUBLIC_API_BASE}
    ports: ["5173:80"]
    depends_on: [gateway-service]

