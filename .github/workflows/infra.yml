name: infra
on:
  pull_request:
    paths: [ 'infra/terraform/**' ]
  push:
    branches: [ master ]
    paths: [ 'infra/terraform/**' ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.5 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: us-east-1
      - run: terraform fmt -check
      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.AWS_ACCOUNT_ID }}-activityual-tfstate" \
            -backend-config="key=activityual/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - run: terraform validate
      - name: terraform plan
        run: |
          terraform plan -no-color \
            -var="github_repo=${{ github.repository }}" \
            -var="tfstate_bucket=${{ secrets.AWS_ACCOUNT_ID }}-activityual-tfstate"
      - if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        name: terraform apply
        run: |
          terraform apply -auto-approve \
            -var="github_repo=${{ github.repository }}" \
            -var="tfstate_bucket=${{ secrets.AWS_ACCOUNT_ID }}-activityual-tfstate"

