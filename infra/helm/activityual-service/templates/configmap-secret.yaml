apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "svc.name" . }}-config
  labels: {{- include "svc.labels" . | nindent 4 }}
data:
{{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
  SPRING_PROFILES_ACTIVE: {{ .Values.env.SPRING_PROFILES_ACTIVE | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "svc.name" . }}-secret
  labels: {{- include "svc.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
{{- end }}

