nameOverride: ""
image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits:   { cpu: 500m, memory: 768Mi }

env:
  LOG_LEVEL: INFO
  SPRING_PROFILES_ACTIVE: prod

config:
  RABBIT_HOST: rabbitmq.platform.svc.cluster.local
  RABBIT_PORT: "5672"

secrets:
  JWT_SECRET: "change-me-please-change-me-please-32bytes!!"
  DB_PASSWORD: "activityual"

probes:
  enabled: true
  path: /actuator/health
  initialDelaySeconds: 30
  periodSeconds: 10

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: false
  className: alb
  host: api.activityual.example.com
  path: /
  annotations: {}

